# engine/systems/data/hd_channels.yaml
# The 36 channels. Each is a gate pair; a channel is defined when BOTH gates are
# activated (by either the personality or the design side).
#
# Verified against an independent published source (2026-08-20):
#   - humandesignsystem.co/en/36-channels-of-the-human-design-chart/ lists
#     all 36 channels by gate pair; every pair below matches one of theirs
#     (compared as unordered gate pairs, since publications vary in which
#     gate they print first), and neither list has an entry the other lacks.
# Like the gate-center map, the channel list is a fixed structural property
# of the bodygraph (it is the set of hexagram pairs the Mandala's gate
# geometry makes adjacent), so exact agreement across sources is expected.
