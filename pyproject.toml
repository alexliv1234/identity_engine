[project]
name = "identity-engine"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "Unidecode>=1.3",
    "lunardate>=0.3.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    # Upper-bounded deliberately: engine/ephemeris/skyfield_adapter.py calls
    # timescale(builtin=True), which bakes skyfield's bundled Delta-T and
    # leap-second tables into TT->UT1->RAMC->every Placidus house cusp. A
    # minor-version upgrade could revise those tables and silently shift
    # cusps for identical input, breaking the byte-identical determinism
    # guarantee in README.md. A full lockfile would pin this more precisely
    # than a version range can; this range is the interim guard.
    "skyfield>=1.49,<2.0",
    "pyluach>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "anthropic>=0.40"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
