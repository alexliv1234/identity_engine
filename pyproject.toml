[project]
name = "identity-engine"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "Unidecode>=1.3",
    "lunardate>=0.3.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    # engine/ephemeris/skyfield_adapter.py calls timescale(builtin=True),
    # which bakes skyfield's bundled Delta-T and leap-second tables into
    # TT->UT1->RAMC->every Placidus house cusp. A *minor* release can revise
    # those tables and shift cusps for identical input.
    #
    # This range does not prevent that, and the comment here used to imply it
    # did. The <2.0 bound only rules out a major API break; every table
    # revision the paragraph above worries about ships inside it. The real
    # guard is detection, not prevention: tests/test_golden.py recomputes all
    # eleven fixtures byte-for-byte, so a table revision that moves a single
    # cusp fails the suite loudly on the upgrade commit, which is where a
    # human can look at the diff and decide. Deliberately not tightened to
    # ==1.55: a pin that blocks security and correctness fixes, on a
    # dependency whose drift is already caught, buys nothing. A lockfile is
    # the right tool for reproducing an exact environment; this range plus
    # the golden suite is the interim.
    "skyfield>=1.49,<2.0",
    "pyluach>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "anthropic>=0.40"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
