[project]
name = "identity-engine"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "Unidecode>=1.3",
    "lunardate>=0.3.0",
    # tzdata's IANA rule tables feed `BirthInput.birth_time_quality`
    # (engine/types.py): the fold-offset comparison that classifies a local
    # reading as exact/ambiguous/nonexistent reads the DST transition rules
    # for the birth zone and date straight out of this package. Before Plan 2
    # a table revision could only nudge a continuous value (a house cusp) by
    # a fraction of a degree; now it can flip a categorical field returned to
    # callers, at identical engine and knowledge-base versions.
    #
    # This range does not prevent a revision from doing that -- CalVer
    # (YYYY.N) has no "major" to pin against the way skyfield's <2.0 does.
    # The ceiling is a one-year lookahead past the version this range was
    # written against (2026.3): far enough to absorb routine releases (tzdata
    # ships several a year) without a bump, close enough that letting it
    # drift further requires a conscious review. Detection, as with skyfield,
    # is a test, not this range: tests/test_birth_time_quality.py hardcodes
    # the 1990-10-28 Europe/London and 1990-04-01 America/New_York
    # transitions and asserts their classification, so a rule-table revision
    # that changes either fails the suite loudly on the upgrade commit.
    "tzdata>=2024.1,<2027; sys_platform == 'win32'",
    # engine/ephemeris/skyfield_adapter.py calls timescale(builtin=True),
    # which bakes skyfield's bundled Delta-T and leap-second tables into
    # TT->UT1->RAMC->every Placidus house cusp. A *minor* release can revise
    # those tables and shift cusps for identical input.
    #
    # This range does not prevent that, and the comment here used to imply it
    # did. The <2.0 bound only rules out a major API break; every table
    # revision the paragraph above worries about ships inside it. The real
    # guard is detection, not prevention: tests/test_golden.py recomputes all
    # eleven fixtures byte-for-byte, so a table revision that moves a single
    # cusp fails the suite loudly on the upgrade commit, which is where a
    # human can look at the diff and decide. Deliberately not tightened to
    # ==1.55: a pin that blocks security and correctness fixes, on a
    # dependency whose drift is already caught, buys nothing. A lockfile is
    # the right tool for reproducing an exact environment; this range plus
    # the golden suite is the interim.
    "skyfield>=1.49,<2.0",
    "pyluach>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
# Spec §6: Postgres in production, SQLite for dev and tests. The driver is a
# separate extra (not just bundled into `dev`) so a production install has a
# documented, non-dev way to get it: `pip install .[postgres]`. Without this,
# a prod deploy that only installs base `dependencies` has no Postgres driver
# and fails to connect the first time it opens a `postgresql://` URL.
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "anthropic>=0.40",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern is exactly the "function call as a
# sentinel default" shape B008 warns about -- `Depends(...)` is only ever
# evaluated once, by design, and FastAPI recognises the sentinel and resolves
# it per-request rather than reusing the return value. That is the documented,
# idiomatic use, not the mutable-default footgun the rule exists to catch.
extend-immutable-calls = ["fastapi.Depends"]
